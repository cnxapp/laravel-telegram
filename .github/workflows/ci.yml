name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - run: composer qa

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            testbench: '^8.0'
            phpunit: '^10.5'
            laravel: '10'
          - php: '8.2'
            testbench: '^9.0'
            phpunit: '^11.5'
            laravel: '11'

    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - run: composer remove --dev larastan/larastan laravel/pint orchestra/testbench phpunit/phpunit --no-update

      - run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" "phpunit/phpunit:${{ matrix.phpunit }}" --no-update

      - run: composer update --prefer-dist --no-interaction

      - run: php vendor/bin/phpunit
