name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '12'
            testbench: '^10.0'
            php: '8.2'
          - laravel: '12'
            testbench: '^10.0'
            php: '8.3'
          - laravel: '12'
            testbench: '^10.0'
            php: '8.4'
          - laravel: '13'
            testbench: '^11.0'
            php: '8.3'
          - laravel: '13'
            testbench: '^11.0'
            php: '8.4'
          - laravel: '13'
            testbench: '^11.0'
            php: '8.5'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-update --no-interaction

      - uses: ramsey/composer-install@v3

      - run: composer qa

  php-compatibility:
    runs-on: ubuntu-latest
    name: PHP 8.1 syntax

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - run: find src -name '*.php' -print0 | xargs -0 -n1 php -l
